name: Build APK with Buildozer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==1.5.0
          sudo apt-get update
          sudo apt-get install -y git ffmpeg cmake libgtk-3-dev libgl1-mesa-dev libegl1-mesa-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good libpython3.8-dev zlib1g-dev libjpeg-dev

      - name: Build APK
        run: |
          cd ${{ github.workspace }}
          buildozer android debug
        continue-on-error: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: finance-app
          path: ${{ github.workspace }}/bin/
          retention-days: 7
