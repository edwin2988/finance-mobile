name: Build APK with Buildozer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build APK with Buildozer
        uses: paulmach/action-buildozer@v1.0.0
        with:
          spec: buildozer.spec
          command: debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: finance-app
          path: bin/
          retention-days: 7
