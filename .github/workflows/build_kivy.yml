name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build with Buildozer
        uses: ArnoNue/buildozer-action@v1.1
        with:
          spec: buildozer.spec
          command: android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: finance-app
          path: bin/
          retention-days: 7
