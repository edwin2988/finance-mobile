name: Build Kivy APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build APK
        run: |
          # 设置权限
          chmod +x gradlew 2>/dev/null || true
          # 执行构建
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: finance-app
          path: bin/*.apk
          retention-days: 7
