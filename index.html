<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>陈大哥的理财账本 📊</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5; 
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        h1 { color: #333; margin-bottom: 20px; text-align: center; }
        .card { 
            background: white; 
            border-radius: 10px; 
            padding: 20px; 
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .total { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-align: center;
        }
        .total h2 { font-size: 32px; margin: 10px 0; }
        .btn { 
            background: #2196F3; 
            color: white; 
            border: none; 
            padding: 12px 24px; 
            border-radius: 5px; 
            font-size: 16px;
            width: 100%;
            margin: 5px 0;
            cursor: pointer;
        }
        .btn:active { background: #1976D2; }
        input, select { 
            width: 100%; 
            padding: 12px; 
            margin: 8px 0; 
            border: 1px solid #ddd; 
            border-radius: 5px;
            font-size: 16px;
        }
        .record { 
            display: flex; 
            justify-content: space-between; 
            padding: 10px; 
            border-bottom: 1px solid #eee;
        }
        .profit { color: #F44336; }
        .loss { color: #4CAF50; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="card total">
        <div>总估值</div>
        <h2 id="totalValue">¥0.00</h2>
        <div id="totalProfit">今日盈亏：--</div>
    </div>

    <div class="card">
        <h3>📊 账户总览</h3>
        <div id="accountList">加载中...</div>
    </div>

    <div class="card">
        <h3>📝 快速录入</h3>
        <input type="date" id="dateInput">
        <input type="text" id="accountInput" placeholder="账户名称">
        <input type="number" id="valueInput" placeholder="估值金额">
        <button class="btn" onclick="addRecord()">保存记录</button>
    </div>

    <div class="card">
        <h3>📋 最近记录</h3>
        <div id="recordList">加载中...</div>
    </div>

    <script>
        const DATA_FILE = 'finance_data_v5.json';
        let data = [];

        // 加载数据
        function loadData() {
            const saved = localStorage.getItem('financeData');
            if (saved) {
                data = JSON.parse(saved);
            }
            render();
        }

        // 保存数据
        function saveData() {
            localStorage.setItem('financeData', JSON.stringify(data));
            render();
        }

        // 渲染界面
        function render() {
            renderTotal();
            renderAccounts();
            renderRecords();
        }

        // 渲染总计
        function renderTotal() {
            const total = data.reduce((sum, r) => sum + (parseFloat(r.current_value) || 0), 0);
            document.getElementById('totalValue').textContent = '¥' + total.toLocaleString('zh-CN', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            
            // 计算今日盈亏（简化版）
            document.getElementById('totalProfit').textContent = '今日盈亏：--';
        }

        // 渲染账户
        function renderAccounts() {
            const accounts = {};
            data.forEach(r => {
                if (!accounts[r.account]) accounts[r.account] = [];
                accounts[r.account].push(r);
            });

            let html = '';
            for (const [name, records] of Object.entries(accounts)) {
                const latest = records.sort((a,b) => b.date.localeCompare(a.date))[0];
                html += `<div class="record"><div>${name}</div><div>¥${latest.current_value}</div></div>`;
            }
            document.getElementById('accountList').innerHTML = html || '暂无账户';
        }

        // 渲染记录
        function renderRecords() {
            const sorted = [...data].sort((a,b) => b.date.localeCompare(a.date)).slice(0, 10);
            let html = '';
            sorted.forEach(r => {
                html += `<div class="record"><div>${r.date} ${r.account}</div><div>¥${r.current_value}</div></div>`;
            }
            document.getElementById('recordList').innerHTML = html || '暂无记录';
        }

        // 添加记录
        function addRecord() {
            const date = document.getElementById('dateInput').value;
            const account = document.getElementById('accountInput').value;
            const value = document.getElementById('valueInput').value;

            if (!date || !account || !value) {
                alert('请填写完整信息');
                return;
            }

            data.push({ date, account, current_value: parseFloat(value) });
            saveData();
            
            // 清空输入
            document.getElementById('accountInput').value = '';
            document.getElementById('valueInput').value = '';
            alert('保存成功！');
        }

        // 初始化
        document.getElementById('dateInput').valueAsDate = new Date();
        loadData();
    </script>
</body>
</html>
